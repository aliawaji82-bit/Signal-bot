name: Crypto Daily Bot

on:
  schedule:
    # مرة باليوم بعد إقفال الشمعة اليومية (00:00 UTC) = 3:17 الفجر بتوقيت السعودية
    - cron: "17 0 * * *"
  workflow_dispatch: {}

# ما نخلي تشغيلين يشتغلون بنفس الوقت ويتعارضون على ملفات الحالة
concurrency:
  group: signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل بوت الكريبتو اليومي
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_bot.py

      - name: حفظ الصفقات والحالة
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto_state.json crypto_trades.json
          git diff --staged --quiet || git commit -m "update crypto state [skip ci]"
          git pull --rebase origin main
          git push
