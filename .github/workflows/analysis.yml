name: Signal analysis (one-off)

on:
  push:
    branches: [analysis/real-results]
    paths: [analysis/*.py, .github/workflows/analysis.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python analysis/new_coins.py
